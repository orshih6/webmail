name: Build and push image

# Every push to main builds sha-<commit> and deploys it (the `deploy` job). Version tags
# (<Cargo version> + latest) are published only for a v* tag or a manual run, so main never
# overwrites a released version.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Same checks and end-to-end suite as every push; no image unless they pass.
  ci:
    uses: ./.github/workflows/ci.yml

  # One native build per architecture (no QEMU: emulated Rust builds take ages), each
  # pushed by digest only; `merge` then publishes them together under the tags.
  build:
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch image under its tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
        run: |
          tags=(-t "$IMAGE:sha-$GITHUB_SHA")
          if [ "$RELEASE" = true ]; then tags+=(-t "$IMAGE:$VERSION" -t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: Check both architectures are in it
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" | tee manifest.txt
          grep -q "linux/amd64" manifest.txt
          grep -q "linux/arm64" manifest.txt

  # Deploy = point orshih6/manifest's apps/webmail at this build's sha- tag; Argo CD notices
  # the commit and rolls deploy/webmail in dms-admin. Only for main, only after the image exists.
  deploy:
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-webmail
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: orshih6/manifest
          ssh-key: ${{ secrets.MANIFEST_DEPLOY_KEY }} # write deploy key on orshih6/manifest

      - name: Point apps/webmail at this build
        env:
          SUBJECT: ${{ github.event.head_commit.message }} # via env, never spliced into the script
        run: |
          cd apps/webmail
          kustomize edit set image "ghcr.io/orshih6/webmail=ghcr.io/orshih6/webmail:sha-${GITHUB_SHA}"
          git diff --quiet && { echo "already on sha-${GITHUB_SHA}"; exit 0; }
          git config user.name "webmail-ci"
          git config user.email "actions@github.com"
          git commit -am "webmail: sha-${GITHUB_SHA::7} ($(printf '%s' "$SUBJECT" | head -1 | cut -c1-60))"
          git push
