[package]
name = "webmail"
version = "0.3.1"
edition = "2024"
description = "A fast, secure, self-hosted webmail client for any IMAP/SMTP server"
license = "AGPL-3.0-only"
repository = "https://github.com/orshih6/webmail"
keywords = ["webmail", "imap", "smtp", "email", "self-hosted"]
categories = ["email", "web-programming"]

[dependencies]
aes-gcm = "0.11.1"
ammonia = "4.2.0"
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
futures = "0.3.34"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "ring", "webpki-roots", "smtp-transport", "builder", "pool"] }
mail-parser = "0.11.9"
rand = "0.10.3"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
webpki-roots = "1.0.9"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
